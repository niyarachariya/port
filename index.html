<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Niya | Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
      background: #f7f3ff;
      color: #2d2540;
    }

    .card {
      width: 90%;
      max-width: 700px;
      padding: 60px 40px;

      background: white;
      border-radius: 28px;

      text-align: center;
      box-shadow: 0 20px 60px rgba(80, 50, 120, 0.12);
    }

    .tag {
      display: inline-block;
      padding: 8px 16px;

      background: #eee5ff;
      color: #7551b8;

      border-radius: 999px;
      font-size: 14px;

      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 48px;
    }

    p {
      color: #746b82;
      font-size: 18px;
      line-height: 1.7;
    }

    .major {
      margin-top: 30px;
      padding: 20px;

      border: 1px solid #eadfff;
      border-radius: 18px;

      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="tag">
      PORTFOLIO 2026
    </div>

    <h1>
      Hello, I'm Niya 👋
    </h1>

    <p>
      Welcome to my personal portfolio website.
    </p>

    <div class="major">
      Food Hospitality and Communicative Language (FH)
    </div>

  </main>

</body>
</html>
